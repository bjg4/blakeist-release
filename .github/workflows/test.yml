name: Release contract
# Hosted checks are paused after the Actions allowance incident.
# Run manually only after an execution budget has been approved.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test.yml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest -v
